name: Correção do projeto (Sênior)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rodar a correção da etapa Sênior
        run: npm run test:senior
